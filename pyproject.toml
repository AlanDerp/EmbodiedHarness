[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-harness"
version = "0.1.0"
description = "Snapshot-bound perception and execution contracts for embodied agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
sam3-client = ["pillow>=10"]
sam3-service = ["pillow>=10", "torch>=2.9,<3"]

[project.scripts]
embodied-sam3 = "embodied_harness.services.sam3.server:main"
embodied-harness = "embodied_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
